<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- stylesheet Boostrap -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->

    <!-- style navbar -->
    <link rel="stylesheet" href="../css/stylesheet-nav-bar-custom.css">
    <!-- stylesheet -->
    <link rel="stylesheet" href="/css/stylesheet-editar-perfil.css">
    <link rel="stylesheet" href="/css/stylesheer.profileCard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/stylesheet-footer.css">

    <title>Mi perfil</title>
</head>

<body>
    <div class="profileeditarperfil">
        <div id="navbarContainer"></div>

        <h2>Mi Perfil</h2>
        <div class="card">
            <img id="perfilImagen" src="img.jpg" alt="perfil" style="width:100%">
            <h1 id="username"></h1>
            <p class="title" id="useremail">jhon@example.com</p>
            <p>Harvard University</p>
            <a href="#"><i class="fa fa-dribbble"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-linkedin"></i></a>
            <a href="#"><i class="fa fa-facebook"></i></a>
            <p><button>Contact</button></p>
            <div class="mt-3">
                <label for="cambiarFoto" class="form-label">Cambiar foto de perfil:</label>
                <input type="file" id="cambiarFoto" accept="image/*">
                <button id="btnSubirFoto" class="btn btn-primary btn-sm mt-2">Subir</button>
            </div>
        </div>
        <br>
        <hr>
        <br>
        <div id="actividad">
            <h3>Actividad reciente</h3>
            <ul id="userposts"></ul>
        </div>
        <div id="compras">
            <h3>Compras realizadas</h3>
            <ul id="userCompras">
                <!-- Aquí se cargarán las compras dinámicamente -->
            </ul>
        </div>
        <br>
        <hr>
        <br>
        <div id="productosVistos">
            <h3>Productos más vistos</h3>
            <ul id="userProductosVistos">
                <!-- Aquí se cargarán los productos más vistos dinámicamente -->
            </ul>
        </div>


        <!-- Modal de verificación -->
        <div id="passwordModal" class="modal">
            <div class="modal-content">
                <h3>Verificación</h3>
                <p>Ingrese su contraseña para confirmar.</p>
                <input type="password" id="verifyPassword" placeholder="contraseña"><br><br>
                <button id="confirmBtn">Confirmar</button>
                <button id="cancelBtn">Cancelar</button>
            </div>
        </div>

        <!-- Footer -->
        <div id="footerContainer"></div>

        <!-- Scripts -->
        <script src="../js/editar-perfil.js"></script>
        <script src="../js/cargar-perfil.js"></script>
        <script src="../js/footer.js"></script>
        <script src="../js/navbar.js"></script>
        <script src="../js/bootstrap.bundle.min.js"></script>
</body>

</html>
