<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Gamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/search.css">

    <!-- CSS personalizado de productos -->
    <link rel="stylesheet" href="../css/stylesheet-productos.css" />

    <!-- CSS personalizado de footer -->
    <link rel="stylesheet" href="../css/stylesheet-footer.css" />

    <!-- CSS personalizado de navbar -->
    <link rel="stylesheet" href="../css/stylesheet-navbar.css" />
</head>



<body class="profileproductos">
    <!-- Navbar -->
    <div id="navbarContainer"></div>

    <!-- Sección de hero -->
    <section class="hero-section">
        <div class="container">
            <h1 class="display-3 fw-bold">Catálogo de Productos</h1>

            <p class="display-6">Encuentra los mejores productos para gamers al mejor precio</p>
            <!--<button class="btn btn-gamer btn-lg mt-3">Ver Ofertas <i class="fas fa-arrow-right ms-2"></i></button>-->
        </div>

    </section>


    <!-- SECCIÓN CATEGORÍAS -->
    <div class="bg-gamer py-3 ">
        <div class="container">
            <div class="d-flex flex-wrap gap-2 justify-content-center" id="category-list">
                <!-- Categorías dinámicas -->
            </div>
        </div>
    </div>

    <!-- PRODUCTOS -->
    <main class="container my-4">
        <div class="row" id="product-list">
            <!-- Productos dinámicos -->
        </div>
    </main>

    <!-- OFFCANVAS CARRITO -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartCanvas">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title">🛒 Carrito de Compras</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-group mb-3" id="cart-items">
                <!-- Items dinámicos -->
            </ul>
            <h4>Total: $<span id="cart-total">0</span></h4>
            <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-danger" id="clear-cart">Vaciar</button>
                <button class="btn btn-success" id="checkout">Pagar</button>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <div id="footerContainer"></div>
    <!--  -->

    <!-- JS -->
    <script src="../js/carrito.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
