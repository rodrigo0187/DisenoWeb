<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio sesión - Level Up Gamer</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet" />
  <!-- Latest compiled JavaScript -->
  <script src="../js/bootstrap.bundle.min.js"></script>
  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../css/stylesheet-inicio-sesion.css" />
  <link rel="stylesheet" href="../css/stylesheet-nav-bar-custom.css" />

  <link rel="stylesheet" href="../css/stylesheet-footer.css">
</head>

<body>
  <!-- Navbar components-->
  <div id="navbarContainer"></div>


  <!-- Formulario de inicio de sesión -->
  <div class="login-container">
    <form>
      <div class="imgcontainer">
        <img src="../img/icon/LOGO.ico" alt="Avatar" class="avatar" />
      </div>

      <div class="container">
        <label for="email"><b>Nombre de usuario</b></label>
        <input type="email" id="email" placeholder="JhonDoe@dominio.cl" name="email" required />

        <label for="psw"><b>contraseña</b></label>
        <input type="password" id="psw" placeholder="Ingresa la contraseña" name="psw" required />
        <!-- error msg -->
        <!-- <p id="msgerror" class="error-msg"></p> -->

        <button type="submit">Ingresar</button>
        <!-- <p id="msgerror" class="error-msg">La contraseña debe estar entre 4 y 10 caracteres.</p> -->
        <label>
          <input type="checkbox" checked="checked" name="remember" /> Recuerdame
        </label>
      </div>

      <div class="container">
        <button type="button" class="cancelbtn">Cancelar</button>
        <span class="psw">¿Olvidó su <a href="#">contraseña?</a></span>
      </div>
    </form>
  </div>

  <!-- footer components -->
  <div id="footerContainer"></div>


  <!-- JS -->
  <script src="../js/validacion-inicio-sesion.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/navbar.js"></script>
</body>

</html>
