<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <title>Perfil Usuario - Level Up Gamer</title>

    <!-- Bootstrap y estilos propios -->
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/stylesheet-nav-bar-custom.css" />

                <p id="useremail">usuario@correo.com</p>

            <form action=""></form>

            </div>

            <h5>Historial de actividad</h5>
            <ul id="userPosts" class="list-group list-group-flush">
                <!-- Aquí se agregan dinámicamente los posts del usuario -->
            </ul>

    <!-- Footer -->
