<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog & Noticias - Level Up Gamer</title>

    <!-- Bootstrap y estilos propios -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- <link rel="stylesheet" href="../css/stylesheet-html-body.css"> -->
    <!-- theme origin page -->
    <link rel="stylesheet" href="../css/stylesheet-general.css">
    <!-- style hoja blog -->
    <link rel="stylesheet" href="../css/stylesheet-blog.css">
    <!-- CSS personalizado de navbar -->
    <link rel="stylesheet" href="../css/stylesheet-navbar.css" />
    <!-- CSS personalizado de footer -->
    <link rel="stylesheet" href="../css/stylesheet-footer.css" />
</head>

<body class="profileblog">
    <div class="page-container">
        <!-- Navbar -->
        <div id="navbarContainer"></div>

        <!-- Sección de hero -->
        <section class="hero-section">
            <div class="container">
                <h1 class="display-3 fw-bold">Blog & Noticias Gamer</h1>

                <p class="display-6">Novedades, guías y consejos para mejorar tu experiencia de juego.</p>
                <!--<button class="btn btn-gamer btn-lg mt-3">Ver Ofertas <i class="fas fa-arrow-right ms-2"></i></button>-->
            </div>
        </section>

        <!-- Aquí se cargarán las noticias (RSS o posts propios) -->
        <section id="news-container" aria-live="polite">
            <!-- Ejemplo estático (opcional) -->
            <article class="news-item mb-4 p-3 border rounded">
                <h2 class="h5">
                    <a href="#" class="news-link" target="_blank" rel="noopener noreferrer">Título de ejemplo:
                        Lanzamiento XYZ</a>
                </h2>
                <p class="meta text-muted small">
                    Publicado: <time datetime="2025-09-11">11 Sept 2025</time> • Fuente: <span
                        class="source">Ejemplo</span>
                </p>
                <p class="excerpt">Resumen breve de la noticia o guía. Aquí irá un extracto para captar la atención
                    del lector...</p>
                <a href="#" class="read-more">Leer más →</a>
            </article>
            <!-- El script RSS reemplazará o añadirá artículos similares dinámicamente -->
        </section>
        </main>

        <!-- Footer -->
        <div id="footerContainer"></div>
        <!--  -->
    </div>

    <!-- Scripts -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!--loader RSS -->
    <script src="../js/rss-loader.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
</body>

</html>
